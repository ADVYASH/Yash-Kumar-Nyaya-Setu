
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educational Resources - All Courses</title>

<style>
:root {
    --black: #000;
    --dark: #080808;
    --red: #721326;
    --hot-red: #ff1744;
    --white: #fbfbfb;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: #000;
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

/* WALLPAPER SLIDESHOW */
.wallpaper-slideshow {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: #000;
    pointer-events: none;
}

.wallpaper-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .8s ease;
}

.wallpaper-slide.active {
    opacity: 1;
}

.wallpaper-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .38);
}

/* HOME BUTTON */
.home-top-button {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 9999;
    padding: 10px 18px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    font-weight: 800;
    box-shadow: 0 3px 10px #0008;
}

.home-top-button:hover {
    background: #1d4ed8;
}

/* HEADER */
.header {
    width: 100%;
    min-height: 180px;
    padding: 20px 85px;
    background: rgba(5, 5, 5, .65);
    border-bottom: 1px solid #3b0b17;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 3px 18px #000;
    z-index: 1;
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.header-logo {
    width: 4cm;
    height: 4cm;
    object-fit: contain;
    flex-shrink: 0;
}

.title {
    margin: 0;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #b51d40;
    -webkit-text-stroke: 2px white;
    text-shadow: 0 0 10px #721326;
    text-align: center;
}

.adult-animation {
    position: absolute;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 48px;
    animation: pulse 2.4s ease-in-out infinite,
               float 3.2s ease-in-out infinite;
}

@keyframes pulse {
    50% {
        filter: drop-shadow(0 0 12px #ff1744);
    }
}

@keyframes float {
    50% {
        margin-top: -6px;
    }
}

/* CATEGORY AREA */
.category-area {
    width: 100%;
    padding: 24px 18px 35px;
    position: relative;
    z-index: 1;
}

.category {
    width: 100%;
    padding: 18px 12px 24px;
    background: rgba(9, 9, 9, .50);
    border: 1px solid #333;
    border-radius: 6px;
}

.category-card-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    width: 78%;
    margin: 0 auto;
    gap: 10px;
}

.category-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: rgba(8, 8, 8, .90);
    border: 2px solid #00ffff;
    border-radius: 9px;
    transition: transform .2s ease, box-shadow .2s ease;
}

.category-card:hover {
    transform: translateY(-3px);
    border-color: var(--hot-red);
    box-shadow: 0 0 6px #ff1744,
                0 0 14px #ff1744,
                0 0 24px #ff1744aa;
}


/* Exactly 3 landscape cards per row */
.category-card-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    width: 90% !important;
    max-width: 1200px;
    margin: 0 auto !important;
    gap: 18px !important;
}

/* Landscape photos */
.category-card-image-link {
    width: 100% !important;
    aspect-ratio: 16 / 9 !important;
    overflow: hidden;
}

/* Responsive images */
.category-card-image {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
}

/* Keep 3 per row on desktop and tablet */
@media (max-width: 760px) {
    .category-card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        width: 96% !important;
        gap: 8px !important;
    }
}

/* 2 per row on very small phones */
@media (max-width: 380px) {
    .category-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
}



.category-card:hover .category-card-image {
    transform: scale(1.04);
}

.category-card-title-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 34px;
    padding: 5px 3px;
    color: white;
    text-decoration: none;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.25;
    overflow-wrap: anywhere;
}

.category-card-title-link:hover {
    color: #ff1744;
}

/* RESPONSIVE LAYOUT */
@media (max-width: 1200px) {
    .category-card-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        width: 88%;
    }

    .title {
        font-size: 44px;
    }
}

@media (max-width: 1000px) {
    .category-card-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        width: 92%;
    }

    .header {
        padding: 20px 65px;
    }

    .title {
        font-size: 36px;
        letter-spacing: 2px;
    }

    .header-logo {
        width: 90px;
        height: 90px;
    }
}

@media (max-width: 760px) {
    .category-card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 96%;
    }

    .category-area {
        padding: 12px 6px 25px;
    }

    .header {
        min-height: 130px;
        padding: 18px 48px;
    }

    .header-content {
        gap: 8px;
    }

    .header-logo {
        width: 65px;
        height: 65px;
    }

    .title {
        font-size: 25px;
        letter-spacing: 1px;
        -webkit-text-stroke: 1px white;
    }

    .adult-animation {
        right: 8px;
        font-size: 26px;
    }

    .home-top-button {
        top: 8px;
        left: 8px;
        padding: 7px 10px;
        font-size: 12px;
    }
}

@media (max-width: 520px) {
    .category-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 94%;
        gap: 10px;
    }

    .header {
        padding: 48px 10px 18px;
    }

    .header-logo {
        width: 52px;
        height: 52px;
    }

    .title {
        font-size: 19px;
        letter-spacing: 0;
    }

    .adult-animation {
        top: 12px;
        right: 10px;
        transform: none;
        font-size: 22px;
    }

    .category {
        padding: 12px 4px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<script>
/* HOME BUTTON */
document.querySelector(".home-top-button").addEventListener("click", function (event) {
    event.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
});

/* WALLPAPER SLIDESHOW: nsfwwallpaper/1.gif through 100.gif */
(function () {
    const box = document.querySelector(".wallpaper-slideshow");
    const overlay = box.querySelector(".wallpaper-overlay");

    let index = 1;
    let activeImage = null;

    function showNext() {
        const image = new Image();
        image.className = "wallpaper-slide";
        image.alt = "";
        image.src = "nsfwwallpaper/" + index + ".gif";

        image.onload = function () {
            box.insertBefore(image, overlay);

            requestAnimationFrame(function () {
                image.classList.add("active");
            });

            const previousImage = activeImage;
            activeImage = image;

            if (previousImage) {
                previousImage.classList.remove("active");
                setTimeout(function () {
                    previousImage.remove();
                }, 900);
            }
        };

        image.onerror = function () {
            image.remove();
        };

        index = index >= 100 ? 1 : index + 1;
    }

    showNext();
    setInterval(showNext, 2000);
})();
</script>
