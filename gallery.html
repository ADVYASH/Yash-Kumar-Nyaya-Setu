<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yash Kumar — Gallery</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b0d12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1400px,calc(100% - 30px));
    margin:auto;
}

header{
    padding:30px 0 20px;
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
}

h1{
    margin:0;
    font-size:clamp(32px,5vw,58px);
    letter-spacing:-2px;
}

.subtitle{
    color:#9da5b4;
    margin-top:8px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    background:#7657ff;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{background:#6043e8}
button:disabled{opacity:.5;cursor:not-allowed}

.upload-box{
    border:1px solid #272d38;
    background:#141820;
    border-radius:18px;
    padding:18px;
    margin-bottom:25px;
}

.upload-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

input[type=file]{
    color:#aaa;
    background:#0e1117;
    border:1px dashed #3b4350;
    border-radius:10px;
    padding:11px;
    max-width:100%;
}

.status{
    margin-top:12px;
    color:#9da5b4;
    min-height:22px;
}

.success{color:#48d597}
.error{color:#ff637b}

.gallery{
    columns:4 240px;
    column-gap:14px;
}

.photo{
    break-inside:avoid;
    margin:0 0 14px;
    border-radius:15px;
    overflow:hidden;
    background:#141820;
    border:1px solid #272d38;
}

.photo img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    background:#080a0e;
}

.name{
    padding:9px 12px;
    font-size:12px;
    color:#9da5b4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    text-align:center;
    color:#777f8e;
    padding:70px 10px;
}

a{
    color:#b9abff;
    text-decoration:none;
}

@media(max-width:700px){
    .container{width:calc(100% - 18px)}
    header{align-items:flex-start;flex-direction:column}
    .gallery{columns:2 145px;column-gap:8px}
    .photo{margin-bottom:8px}
}

.name{
    padding:9px 12px;
    font-size:12px;
    color:#9da5b4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <h1>Nyaya Setu Gallery</h1>
        <div class="subtitle">Upload photo and show images below</div>
    </div>

    <button id="refreshBtn">Refresh Gallery</button>
</header>

<div class="upload-box">

    <div class="upload-row">

        <input
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
        >

        <button id="uploadBtn">
            Add Photo to Gallery
        </button>
<button id="clearTokenBtn" type="button">
            Clear Token
        </button>

    </div>

    <div id="status" class="status">
        Select photos and upload them directly to GitHub.
    </div>

</div>

<div id="gallery" class="gallery"></div>

<div id="empty" class="empty" style="display:none">
    No photos found in the gallery folder.
</div>

</div>


<script>

/* =========================================================
   GITHUB SETTINGS
   ========================================================= */

const GITHUB_OWNER = "ADVYASH";
const GITHUB_REPO = "Yash-Kumar-Nyaya-Setu";
const GITHUB_BRANCH = "main";
const GITHUB_FOLDER = "gallery";

/*
   PASTE YOUR GITHUB TOKEN BELOW.

   Example:

   const GITHUB_TOKEN = "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";

   IMPORTANT:
   Anyone who can access this HTML file can technically
   inspect this token. Only use this version where that
   risk is acceptable.
*/

const GITHUB_TOKEN = "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";


/* =========================================================
   ELEMENTS
   ========================================================= */

const gallery = document.getElementById("gallery");
const empty = document.getElementById("empty");
const statusBox = document.getElementById("status");
const photoInput = document.getElementById("photoInput");
const uploadBtn = document.getElementById("uploadBtn");
const refreshBtn = document.getElementById("refreshBtn");

const API =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`;


/* =========================================================
   STATUS
   ========================================================= */

function status(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}


/* =========================================================
   GITHUB API
   ========================================================= */

async function githubRequest(url, options = {}) {

    const headers = {
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...options.headers
    };

    return fetch(url, {
        ...options,
        headers
    });
}


/* =========================================================
   LOAD GALLERY
   ========================================================= */

async function loadGallery() {

    gallery.innerHTML = "";
    empty.style.display = "none";

    status("Loading gallery...");

    try {

        const url =
            `${API}/contents/${GITHUB_FOLDER}?ref=${encodeURIComponent(GITHUB_BRANCH)}`;

        const response = await githubRequest(url);

        if (response.status === 404) {

            empty.style.display = "block";

            status(
                "Gallery folder is empty or does not exist yet."
            );

            return;
        }

        if (!response.ok) {
            throw new Error(
                "GitHub returned HTTP " + response.status
            );
        }

        const files = await response.json();

        const images = files
            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|gif|webp|bmp|avif|svg)$/i.test(file.name)
            )
            .sort((a,b) =>
                b.name.localeCompare(a.name)
            );

        if (!images.length) {

            empty.style.display = "block";

            status("No photos found.");

            return;
        }

        images.forEach(file => {

            const figure = document.createElement("figure");

            figure.className = "photo";

            const img = document.createElement("img");

            img.src = file.download_url;
            img.alt = file.name;
            img.loading = "lazy";

            figure.appendChild(img);

            gallery.appendChild(figure);

        });

        status(
            `${images.length} photo${images.length === 1 ? "" : "s"} loaded.`,
            "success"
        );

    } catch(error) {

        console.error(error);

        status(
            "Could not load gallery: " + error.message,
            "error"
        );
    }
}


/* =========================================================
   FILE → BASE64
   ========================================================= */

function fileToBase64(file) {

    return new Promise((resolve,reject) => {

        const reader = new FileReader();

        reader.onload = () => {

            const result = String(reader.result);

            resolve(
                result.substring(result.indexOf(",") + 1)
            );
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


/* =========================================================
   SAFE FILE NAME
   ========================================================= */

function safeFileName(name) {

    return name
        .replace(/[^\w.\-() ]+/g,"_")
        .replace(/\s+/g,"_");
}


/* =========================================================
   UPLOAD
   ========================================================= */

async function uploadPhotos() {

    const files = Array.from(photoInput.files);

    if (!files.length) {

        status(
            "Please select at least one photo.",
            "error"
        );

        return;
    }
    uploadBtn.disabled = true;
    refreshBtn.disabled = true;

    try {

        for (let i = 0; i < files.length; i++) {

            const file = files[i];

            if (!file.type.startsWith("image/")) {

                throw new Error(
                    file.name + " is not an image."
                );
            }

            /*
              GitHub API has practical limits for browser uploads.
              Keep individual images reasonably sized.
            */

            if (file.size > 25 * 1024 * 1024) {

                throw new Error(
                    file.name + " is larger than 25 MB."
                );
            }

            status(
                `Uploading ${i + 1}/${files.length}: ${file.name}...`
            );

            const base64 = await fileToBase64(file);

            const filename =
                `${Date.now()}-${i}-${safeFileName(file.name)}`;

            const path =
                `${GITHUB_FOLDER}/${filename}`;

            const encodedPath =
                path
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");

            const response = await fetch(
                `${API}/contents/${encodedPath}`,
                {
                    method:"PUT",

                    headers:{
                        "Accept":"application/vnd.github+json",
                        "Authorization":
                            `Bearer ${GITHUB_TOKEN}`,
                        "X-GitHub-Api-Version":
                            "2022-11-28",
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            `Add photo: ${filename}`,

                        content:base64,

                        branch:GITHUB_BRANCH
                    })
                }
            );

            if (!response.ok) {

                let errorMessage =
                    `GitHub upload failed (${response.status})`;

                try {

                    const data =
                        await response.json();

                    if (data.message) {
                        errorMessage = data.message;

                        if (data.message.toLowerCase().includes("bad credentials")) {
                            errorMessage =
                                "GitHub says Bad credentials. Revoke the old token and create a new token with repository Contents: Read and write permission.";
                        }
                    }

                } catch(e) {}

                throw new Error(errorMessage);
            }
        }

        photoInput.value = "";

        status(
            "Upload complete. Loading gallery...",
            "success"
        );

        /*
           Give GitHub a moment to update the raw image URLs.
        */

        setTimeout(loadGallery, 1200);

    } catch(error) {

        console.error(error);

        status(
            "Upload failed: " + error.message,
            "error"
        );

    } finally {

        uploadBtn.disabled = false;
        refreshBtn.disabled = false;
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

uploadBtn.addEventListener(
    "click",
    uploadPhotos
);

refreshBtn.addEventListener(
    "click",
    loadGallery
);


/* =========================================================
   START
   ========================================================= */

loadGallery();

</script>

</body>
</html>
