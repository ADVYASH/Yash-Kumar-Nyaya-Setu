<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Educational Resources</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background: #111;
        }

        /* =========================================
           BACKGROUND WALLPAPER
        ========================================= */

        .wallpaper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -3;

            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;

            opacity: 1;
            transition: none;
        }

        .wallpaper-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.65)
                );
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 24px 18px 60px;
        }

        /* =========================================
           HEADING
        ========================================= */

        .main-heading {
            text-align: center;
            font-size: clamp(32px, 5vw, 60px);
            font-weight: 800;
            margin-bottom: 30px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(255, 255, 255, 0.2);
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 35px;
        }

        .resource-button {
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.65);
            color: white;

            min-width: 55px;
            padding: 12px 20px;

            border-radius: 8px;
            cursor: pointer;

            font-size: 17px;
            font-weight: bold;

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .resource-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .resource-button.active {
            background: #ffffff;
            color: #111;

            box-shadow:
                0 5px 20px rgba(255, 255, 255, 0.35);
        }

        /* =========================================
           RESOURCE SECTIONS
        ========================================= */

        .resource-section {
            display: none;
        }

        .resource-section.active {
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;

            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
        }

        /* =========================================
           PHOTO GRID
           2 PHOTOS PER ROW
        ========================================= */

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Alternating centered rows:
           2 photos, then 1 centered photo, then 2, then 1... */
        .photo-grid .photo-card:nth-child(3n) {
            grid-column: 1 / -1;
            justify-self: center;
            width: calc((100% - 20px) / 2);
        }

        /* =========================================
           PHOTO CARD
        ========================================= */

/* =========================================
   PHOTO CARD — TWO-STAGE NEON ANIMATION
========================================= */

.photo-card {
    position: relative;
    background: rgba(0, 0, 0, 0.78);
    border: none;
    border-radius: 14px;
    padding: 12px;
    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.45);

    transition:
        transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.4s ease;
}

/* Always-active moving neon border */
.photo-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 2px;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            transparent 30%,
            #00ffff 42%,
            #ffffff 50%,
            #00ffff 58%,
            transparent 70%,
            transparent 100%
        );

    background-size: 250% 100%;
    animation: neonTravel 2.2s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;

    mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    mask-composite: exclude;

    z-index: 2;
    pointer-events: none;

    transition: filter 0.4s ease;
}

/* Always-active breathing glow */
.photo-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;

    border: 2px solid rgba(0, 255, 255, 0.25);

    box-shadow:
        0 0 8px rgba(0, 255, 255, 0.35),
        0 0 18px rgba(0, 255, 255, 0.20);

    animation: neonPulse 1.8s ease-in-out infinite alternate;

    pointer-events: none;
    z-index: 1;
}

/* Keep content above animation */
.photo-card > * {
    position: relative;
    z-index: 3;
}

@keyframes neonTravel {
    0% {
        background-position: 250% 0;
    }

    100% {
        background-position: -250% 0;
    }
}

@keyframes neonPulse {
    0% {
        opacity: 0.35;
        box-shadow:
            0 0 5px rgba(0, 255, 255, 0.25),
            0 0 12px rgba(0, 255, 255, 0.15);
    }

    100% {
        opacity: 1;
        box-shadow:
            0 0 10px rgba(0, 255, 255, 0.8),
            0 0 25px rgba(0, 255, 255, 0.55),
            0 0 45px rgba(0, 255, 255, 0.25);
    }
}

/* =========================================
   MOUSE HOVER — SECOND ANIMATION
========================================= */

.photo-card:hover {
    transform: translateY(-8px) scale(1.025);

    box-shadow:
        0 0 15px rgba(0, 255, 255, 1),
        0 0 35px rgba(0, 255, 255, 0.8),
        0 0 65px rgba(0, 140, 255, 0.5),
        0 20px 50px rgba(0, 0, 0, 0.8);

    animation: hoverFlash 0.45s ease-out;
}

.photo-card:hover::before {
    filter:
        brightness(1.8)
        drop-shadow(0 0 6px #00ffff)
        drop-shadow(0 0 15px #00ffff);

    animation-duration: 1.1s;
}

.photo-card:hover::after {
    border-color: rgba(0, 255, 255, 0.8);

    animation:
        hoverGlow 0.8s ease-in-out infinite alternate;
}

@keyframes hoverGlow {
    from {
        box-shadow:
            0 0 8px rgba(0, 255, 255, 0.5),
            0 0 20px rgba(0, 255, 255, 0.4);
    }

    to {
        box-shadow:
            0 0 15px rgba(0, 255, 255, 1),
            0 0 35px rgba(0, 255, 255, 0.8),
            0 0 65px rgba(0, 140, 255, 0.5);
    }
}

@keyframes hoverFlash {
    0% {
        filter: brightness(1);
    }

    35% {
        filter: brightness(1.35);
    }

    100% {
        filter: brightness(1);
    }
}

/* =========================================
   IMAGE
========================================= */

.photo-link {
    display: block;
    position: relative;
    width: 100%;
    height: 300px;

    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    overflow: hidden;
}

.photo-link img {
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;
    display: block;

    transition:
        transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
        filter 0.5s ease;
}

.photo-card:hover .photo-link img {
    transform: scale(1.06);

    filter:
        brightness(1.12)
        contrast(1.08)
        saturate(1.2);
}

/* Moving light beam over image on hover */
.photo-link::after {
    content: "";

    position: absolute;
    top: -20%;
    left: -120%;

    width: 60%;
    height: 140%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255, 255, 255, 0.05) 30%,
            rgba(255, 255, 255, 0.8) 50%,
            rgba(0, 255, 255, 0.4) 60%,
            transparent 100%
        );

    transform: skewX(-20deg);
    pointer-events: none;
    opacity: 0;
}

.photo-card:hover .photo-link::after {
    opacity: 1;
    animation: imageShine 0.8s ease-out;
}

@keyframes imageShine {
    0% {
        left: -120%;
    }

    100% {
        left: 150%;
    }
}

/* =========================================
           PHOTO TITLE
        ========================================= */

        .photo-title {
            text-align: center;

            font-size: 19px;
            font-weight: bold;

            padding: 15px 8px 7px;

            color: #ffffff;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.8);
        }

        /* =========================================
           FOOTER
        ========================================= */

        footer {
            text-align: center;
            padding: 45px 10px 15px;

            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {
            .container {
                padding-left: 30px;
                padding-right: 30px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .photo-grid .photo-card:nth-child(3n) {
                width: calc((100% - 20px) / 2);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {
            .container {
                padding-left: 20px;
                padding-right: 20px;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }

            .photo-grid .photo-card:nth-child(3n) {
                grid-column: auto;
                width: 100%;
            }
        }

        @media (max-width: 500px) {

            .container {
                padding-left: 14px;
                padding-right: 14px;
            }

            .main-heading {
                font-size: 34px;
            }

            .buttons {
                gap: 7px;
            }

            .resource-button {
                min-width: 45px;
                padding: 10px 14px;
                font-size: 15px;
            }

            .photo-link {
                aspect-ratio: 16 / 9;
                height: auto;
            }

            .photo-title {
                font-size: 17px;
            }

            .photo-card {
                padding: 8px;
            }
        }

    
/* ===== FINAL MOUSE HOVER COLOR: RED #ff0033 ===== */
.photo-card:hover {
    border: 2px solid #ff0033 !important;
    box-shadow:
        0 0 8px #ff0033,
        0 0 20px #ff0033,
        0 0 40px rgba(255, 0, 51, .9),
        0 20px 50px rgba(0, 0, 0, .8) !important;
}

.photo-card:hover::before {
    background: linear-gradient(
        90deg,
        transparent 0%,
        transparent 28%,
        #ff0033 42%,
        #ffffff 50%,
        #ff0033 58%,
        transparent 72%,
        transparent 100%
    ) !important;
    filter:
        brightness(1.8)
        drop-shadow(0 0 5px #ff0033)
        drop-shadow(0 0 12px #ff0033)
        drop-shadow(0 0 22px #ff0033) !important;
}

.photo-card:hover::after {
    border: 2px solid #ff0033 !important;
    border-color: #ff0033 !important;
    box-shadow:
        0 0 8px #ff0033,
        0 0 18px #ff0033,
        0 0 35px rgba(255, 0, 51, .9) !important;
}

.photo-card:hover .photo-link::after {
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,.05) 30%,
        rgba(255,0,51,.95) 50%,
        rgba(255,0,51,.65) 60%,
        transparent 100%
    ) !important;
}


        /* =========================================
           PASSWORD LOCK SCREEN
        ========================================= */
        body.locked {
            overflow: hidden;
        }

        .password-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .password-modal {
            width: min(420px, 100%);
            padding: 30px;
            border-radius: 18px;
            background: rgba(15, 15, 15, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                0 0 25px rgba(0, 255, 255, 0.25),
                0 20px 70px rgba(0, 0, 0, 0.75);
            text-align: center;
        }

        .password-modal h2 {
            margin-bottom: 10px;
            font-size: 27px;
            color: #fff;
        }

        .password-modal p {
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 14px;
        }

        .password-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
        }

        .password-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .password-submit {
            width: 100%;
            margin-top: 14px;
            padding: 13px 16px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            background: #00ffff;
            color: #071010;
            font-size: 16px;
            font-weight: 800;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .password-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.55);
        }

        .password-error {
            min-height: 20px;
            margin-top: 10px;
            color: #ff4d6d;
            font-size: 13px;
        }

        .password-modal.shake {
            animation: passwordShake 0.35s ease;
        }

        @keyframes passwordShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

</style>
</head>

<body class="locked">

    <!-- =========================================
         PASSWORD LOCK
    ========================================== -->
    <div class="password-overlay" id="passwordOverlay">
        <form class="password-modal" id="passwordModal">
            <h2>Enter Password</h2>
            <p>Enter the password to access the educational resources.</p>
            <input
                id="passwordInput"
                class="password-input"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Password"
                aria-label="Password"
                autofocus
            >
            <button class="password-submit" type="submit">Unlock</button>
            <div class="password-error" id="passwordError" aria-live="polite"></div>
        </form>
    </div>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="wallpaper" id="wallpaper"></div>
    <div class="wallpaper-overlay"></div>


    <main class="container">

        <!-- =========================================
             MAIN HEADING
        ========================================== -->

        <h1 class="main-heading">
            Educational Resources
        </h1>


        <!-- =========================================
             BUTTONS 1-10
        ========================================== -->

        <div class="buttons">

            <button class="resource-button active"
                    onclick="showSection(1)">
                1
            </button>

            <button class="resource-button"
                    onclick="showSection(2)">
                2
            </button>

            <button class="resource-button"
                    onclick="showSection(3)">
                3
            </button>

            <button class="resource-button"
                    onclick="showSection(4)">
                4
            </button>

            <button class="resource-button"
                    onclick="showSection(5)">
                5
            </button>

            <button class="resource-button"
                    onclick="showSection(6)">
                6
            </button>

            <button class="resource-button"
                    onclick="showSection(7)">
                7
            </button>

            <button class="resource-button"
                    onclick="showSection(8)">
                8
            </button>

            <button class="resource-button"
                    onclick="showSection(9)">
                9
            </button>

            <button class="resource-button"
                    onclick="showSection(10)">
                10
            </button>

        </div>


        <!-- =========================================
             RESOURCE SECTIONS
        ========================================== -->

        <div id="resources"></div>


    </main>


    <footer>
        Educational Resources
    </footer>


    <script>

        /* =====================================================
           PASSWORD PROTECTION
           Password: 11111111
        ===================================================== */
        const ACCESS_PASSWORD = "11111111";
        const passwordOverlay = document.getElementById("passwordOverlay");
        const passwordModal = document.getElementById("passwordModal");
        const passwordInput = document.getElementById("passwordInput");
        const passwordError = document.getElementById("passwordError");

        passwordInput.focus();

        passwordModal.addEventListener("submit", function (event) {
            event.preventDefault();

            if (passwordInput.value === ACCESS_PASSWORD) {
                document.body.classList.remove("locked");
                passwordOverlay.style.display = "none";
                passwordInput.value = "";
            } else {
                passwordError.textContent = "Incorrect password. Please try again.";
                passwordInput.value = "";
                passwordModal.classList.remove("shake");
                void passwordModal.offsetWidth;
                passwordModal.classList.add("shake");
                passwordInput.focus();
            }
        });


        /* =====================================================
           PHOTO DATA

           Each section contains 20 photos.
           There are 2 photos per row.

           Change:
             image = your image filename
             title = title shown underneath
             link = website opened in a NEW TAB
        ===================================================== */

        const resources = {

            1: [
                { image: "images/1-1.jpg",  title: "Resource 1",  link: "https://example.com/1" },
                { image: "images/1-2.jpg",  title: "Resource 2",  link: "https://example.com/2" },
                { image: "images/1-3.jpg",  title: "Resource 3",  link: "https://example.com/3" },
                { image: "images/1-4.jpg",  title: "Resource 4",  link: "https://example.com/4" },
                { image: "images/1-5.jpg",  title: "Resource 5",  link: "https://example.com/5" },
                { image: "images/1-6.jpg",  title: "Resource 6",  link: "https://example.com/6" },
                { image: "images/1-7.jpg",  title: "Resource 7",  link: "https://example.com/7" },
                { image: "images/1-8.jpg",  title: "Resource 8",  link: "https://example.com/8" },
                { image: "images/1-9.jpg",  title: "Resource 9",  link: "https://example.com/9" },
                { image: "images/1-10.jpg", title: "Resource 10", link: "https://example.com/10" },
                { image: "images/1-11.jpg", title: "Resource 11", link: "https://example.com/11" },
                { image: "images/1-12.jpg", title: "Resource 12", link: "https://example.com/12" },
                { image: "images/1-13.jpg", title: "Resource 13", link: "https://example.com/13" },
                { image: "images/1-14.jpg", title: "Resource 14", link: "https://example.com/14" },
                { image: "images/1-15.jpg", title: "Resource 15", link: "https://example.com/15" },
                { image: "images/1-16.jpg", title: "Resource 16", link: "https://example.com/16" },
                { image: "images/1-17.jpg", title: "Resource 17", link: "https://example.com/17" },
                { image: "images/1-18.jpg", title: "Resource 18", link: "https://example.com/18" },
                { image: "images/1-19.jpg", title: "Resource 19", link: "https://example.com/19" },
                { image: "images/1-20.jpg", title: "Resource 20", link: "https://example.com/20" }
            ],

            2: [],
            3: [],
            4: [],
            5: [],
            6: [],
            7: [],
            8: [],
            9: [],
            10: []
        };


        /* =====================================================
           AUTOMATICALLY CREATE 20 PLACEHOLDER ITEMS
           FOR SECTIONS 2-10

           You can replace these later with your real
           image names, titles and links.
        ===================================================== */

        for (let section = 2; section <= 10; section++) {

            for (let i = 1; i <= 20; i++) {

                resources[section].push({

                    image: `images/${section}-${i}.jpg`,

                    title: `Section ${section} - Resource ${i}`,

                    link: `https://example.com/${section}-${i}`

                });

            }
        }


        /* =====================================================
           CREATE RESOURCE SECTIONS
        ===================================================== */

        const resourcesContainer =
            document.getElementById("resources");


        for (let section = 1; section <= 10; section++) {

            const sectionElement =
                document.createElement("section");

            sectionElement.className =
                "resource-section";

            sectionElement.id =
                `section-${section}`;


            if (section === 1) {
                sectionElement.classList.add("active");
            }


            const heading =
                document.createElement("h2");

            heading.className =
                "section-title";

            heading.textContent =
                `Educational Resources - ${section}`;


            sectionElement.appendChild(heading);


            const grid =
                document.createElement("div");

            grid.className =
                "photo-grid";


            resources[section].forEach(item => {

                const card =
                    document.createElement("article");

                card.className =
                    "photo-card";


                /*
                 * Clicking the image opens the
                 * specified URL in a new tab.
                 */

                const link =
                    document.createElement("a");

                link.className =
                    "photo-link";

                link.href =
                    item.link;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";


                const image =
                    document.createElement("img");

                image.src =
                    item.image;

                image.alt =
                    item.title;

                /*
                 * Browser fallback if image is missing.
                 */

                image.onerror = function() {

                    this.style.display = "none";

                    this.parentElement.style.background =
                        "rgba(255,255,255,0.08)";

                };


                link.appendChild(image);


                const title =
                    document.createElement("div");

                title.className =
                    "photo-title";

                title.textContent =
                    item.title;


                card.appendChild(link);

                card.appendChild(title);

                grid.appendChild(card);

            });


            sectionElement.appendChild(grid);

            resourcesContainer.appendChild(sectionElement);

        }


        /* =====================================================
           BUTTON / SECTION SWITCHING
        ===================================================== */

        function showSection(number) {

            /*
             * Hide every section.
             */

            document
                .querySelectorAll(".resource-section")
                .forEach(section => {

                    section.classList.remove("active");

                });


            /*
             * Show selected section.
             */

            const selected =
                document.getElementById(
                    `section-${number}`
                );

            if (selected) {
                selected.classList.add("active");
            }


            /*
             * Update active button.
             */

            document
                .querySelectorAll(".resource-button")
                .forEach(button => {

                    button.classList.remove("active");

                });


            const buttons =
                document.querySelectorAll(
                    ".resource-button"
                );

            if (buttons[number - 1]) {

                buttons[number - 1]
                    .classList.add("active");

            }


            /*
             * Scroll back toward the heading.
             */

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================================
           BACKGROUND WALLPAPER SLIDESHOW

           Files:
           nsfwwallpaper/1.gif
           nsfwwallpaper/2.gif
           ...
           nsfwwallpaper/100.gif

           The order is SHUFFLED.

           Each wallpaper stays for 2.2 seconds.
           Switches instantly — no fade.
        ===================================================== */

        const wallpaper =
            document.getElementById("wallpaper");


        /*
         * Create numbers 1-100.
         */

        let wallpapers =
            Array.from(
                { length: 100 },
                (_, index) => index + 1
            );


        /*
         * Fisher-Yates shuffle.
         */

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] =
                [
                    array[j],
                    array[i]
                ];

            }

            return array;
        }


        wallpapers =
            shuffle(wallpapers);


        let wallpaperIndex = 0;


        /*
         * Set first wallpaper.
         */

        function setWallpaper(number) {

            wallpaper.style.backgroundImage =
                `url("nsfwwallpaper/${number}.gif")`;

        }


        setWallpaper(
            wallpapers[wallpaperIndex]
        );


        /*
         * Change wallpaper every 2.2 seconds.
         * No fade, no delay — just switch to the next one.
         */

        setInterval(() => {

            wallpaperIndex++;

            /*
             * When all 100 wallpapers have
             * been shown, shuffle again.
             */

            if (
                wallpaperIndex >= wallpapers.length
            ) {

                wallpapers =
                    shuffle(wallpapers);

                wallpaperIndex = 0;

            }

            setWallpaper(
                wallpapers[wallpaperIndex]
            );

        }, 2200);

    </script>
