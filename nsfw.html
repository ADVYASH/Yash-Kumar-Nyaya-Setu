        body {

        }

        /* =========================
           HEADER
        ========================= */

            height: 180px;
            width: 100%;

            background: rgba(5, 5, 5, 0.42);

            border-bottom: 1px solid #3b0b17;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            box-shadow:
                0 3px 18px rgba(0, 0, 0, 0.9);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        /* =========================
           HEADER LOGO
        ========================= */

        .header img {
            width: 4cm;
            height: 4cm;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 5px rgba(181, 29, 64, 0.25)
                );
        }

        /* =========================
           NSFW TITLE
        ========================= */

            margin: 0;

            font-family:

                "Cooper Black",
                "Arial Black",
                Arial,
                sans-serif;

            font-size: 60px;
            font-weight: 900;

            letter-spacing: 4px;

            color: var(--hot-red);

            -webkit-text-stroke: 2px var(--white);

            text-shadow:
                0 0 4px rgba(181, 29, 64, 0.45),
                0 0 10px rgba(114, 19, 38, 0.25);

            white-space: nowrap;
        }

        /* =========================
           MENU
        ========================= */

        .menu-wrapper {
            position: absolute;

            left: 24px;
            top: 50%;

            transform: translateY(-50%);

            z-index: 1000;
        }

        .menu-icon {
            width: 42px;
            height: 36px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 5px 0;

            cursor: pointer;

            user-select: none;
        }

        .menu-icon span {
            display: block;

            width: 42px;
            height: 4px;

            background: var(--white);

            border-radius: 5px;

            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .menu-icon:hover span {
            background: var(--hot-red);

            box-shadow:
                0 0 5px rgba(181, 29, 64, 0.4);
        }

        /* IMAGE VIEW BUTTON */
        .image-view-link {
            position: absolute;
            left: 78px;
            top: 50%;
            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--white);
            text-decoration: none;
            font-size: 30px;
            line-height: 1;

            cursor: pointer;
            user-select: none;

            border-radius: 6px;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                background 0.2s ease;
        }

        .image-view-link:hover {
            transform: translateY(-50%) scale(1.1);
            filter: drop-shadow(0 0 6px rgba(181, 29, 64, 0.5));
            background: rgba(114, 19, 38, 0.18);
        }

        .image-view-link:focus-visible {
            outline: 2px solid var(--hot-red);
            outline-offset: 3px;
        }

        /* =========================
           MENU TABLE
        ========================= */

        .menu-table-container {
            position: absolute;

            top: 48px;
            left: 0;

            width: 190px;

            opacity: 0;
            visibility: hidden;

            transform: translateY(-8px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0.2s ease;
        }

        .menu-table-container.active {
            opacity: 1;
            visibility: visible;

            transform: translateY(0);
        }

        .menu-table {
            width: 100%;

            border-collapse: collapse;

            background: #080808;

            border: 1px solid #3b0b17;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.8);
        }

        .menu-table th {
            padding: 12px;

            background: var(--white);
            color: #ff0000;

            font-size: 15px;
            font-weight: 900;

            letter-spacing: 2px;

            border-bottom: 1px solid #555;
        }

        .menu-table td {
            padding: 11px 14px;

            color: var(--soft-white);

            background: #ff0000;

            border-bottom: 1px solid #202020;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                padding-left 0.2s ease;
        }

        .menu-table tr:last-child td {
            border-bottom: none;
        }

        .menu-table td:hover {
            background: #151515;
            color: var(--hot-red);
            padding-left: 19px;
        }

           18+ ANIMATION
        ========================= */

            top: 50%;

            user-select: none;

            animation:

            filter:

                    0 0 5px rgba(181, 29, 64, 0.25)

        }

            100% {

                filter:
                    drop-shadow(
                        0 0 3px rgba(181, 29, 64, 0.15)
                    );
            }

            50% {
                opacity: 1;

                filter:
                    drop-shadow(
                        0 0 9px rgba(181, 29, 64, 0.4)
                    );
            }
        }

        @keyframes adultFloat {
            0%,
            100% {
                margin-top: 0;
            }

            50% {
                margin-top: -6px;
            }
        }

        @keyframes adultRotate {
            0%,
            100% {
                transform:
                    translateY(-50%)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-50%)
                    rotate(2deg);
            }
        }

           CATEGORY BUTTONS + EXPANDABLE CONTENT
        ========================= */

        .category-area {
            width: 100%;
            padding: 16px 18px 30px;
            position: relative;
            z-index: 1;
        }

        .category-buttons {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        .category-button {

            border-radius: 4px;
            background: rgba(8, 8, 8, 0.86);

            transition:

            color: #fff;
            border-color: #fff;
            transform: translateY(-1px);
        }

        .category-content {
            width: 100%;
        }

        .category {
            display: none;
            width: 100%;
            padding: 14px 12px 18px;
            background: rgba(9, 9, 9, 0.48);
            border: 1px solid #242424;
        }

        .category.active {
            display: block;
        }

            margin: 0 0 12px;
            padding: 7px 8px;
            color: var(--white);
            font-size: 17px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.5px;
            background: #0c0c0c;
            border: 2px solid #eeeeee;
            border-radius: 3px;
        }

        .category ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0 10px;
        }

        .category li {
            margin: 0;
            padding: 0;
        }

        .category a {
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            border-bottom: 1px solid #202020;
            transition:
                color 0.18s ease,
                background 0.18s ease,
                padding-left 0.18s ease;
        }

        .category a:hover {
            color: #ffffff;
            background: linear-gradient(
                90deg,
                rgba(114, 19, 38, 0.16),
                transparent
            );
            padding-left: 12px;
        }

        .category a img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 3px;
        }

        @media (max-width: 1200px) {
            .category-buttons {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .category ul {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .category-buttons {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .category ul {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .category-area {
                padding: 10px;
            }

            .category-buttons {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .category ul {
                grid-template-columns: 1fr;
            }

            .category-button {
                min-height: 40px;
                font-size: 12px;
            }

            z-index: 0;
            overflow: hidden;
            background: #000;
            pointer-events: none;
        }

        .wallpaper-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            filter: brightness(1.10) saturate(1.10);
        }

        .wallpaper-slide.active {
            opacity: 1;
        }

        .wallpaper-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, .08);
        }

        .header,
        .columns {
            position: relative;
            z-index: 1;

                    'wallpaper-slide' +
                    (index === 0 ? ' active' : '');

                img.src = 'nsfwwallpaper/' + file;
                img.alt = 'Wallpaper ' + (index + 1);
                img.decoding = 'async';

                /* Load the first wallpaper immediately. */
                if (index === 0) {
                    img.loading = 'eager';
                } else {
                    img.loading = 'lazy';
                }

                img.addEventListener('error', function () {
                    console.warn(
                        'Wallpaper could not be loaded: ' + img.src
                    );
                });

                box.insertBefore(img, overlay);
                slides.push(img);
            });

            if (!slides.length) return;

            let current = 0;

            /* Change wallpaper every 2.2 seconds. */
            setInterval(function () {
                slides[current].classList.remove('active');

                current = (current + 1) % slides.length;

                slides[current].classList.add('active');
            }, 2200);
        })();

    if (!menuButton) return;

    menuButton.setAttribute("aria-label", "Go to top");
    menuButton.setAttribute("title", "Go to top");

    menuButton.addEventListener("click", function (event) {
        event.preventDefault();
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
});
